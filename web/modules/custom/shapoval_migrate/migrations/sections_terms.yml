id: sections_terms
label: 'Sections vocabulary (folders of the old tree)'
migration_tags: [shapoval]
source:
  plugin: shapoval_structure
  key: migrate
  kind: folders
destination:
  plugin: 'entity:taxonomy_term'
  default_bundle: sections
process:
  vid:
    plugin: default_value
    default_value: sections
  name: Head
  description/value:
    plugin: shapoval_body
    source: Text
  description/format:
    plugin: default_value
    default_value: full_html
  field_teaser/value:
    plugin: shapoval_body
    source: Descr
  field_teaser/format:
    plugin: default_value
    default_value: full_html
  field_image:
    plugin: shapoval_media
    source: image_url
  field_old_id: ID
  weight: SortOrder
  parent:
    -
      plugin: migration_lookup
      migration: sections_terms
      source: ParentID
      no_stub: true
    -
      plugin: default_value
      default_value: 0
  path/alias: alias
  path/pathauto:
    plugin: default_value
    default_value: 0
migration_dependencies:
  required:
    - media_files
