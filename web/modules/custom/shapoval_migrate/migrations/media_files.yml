id: media_files
label: 'Media: files from uploads/'
migration_tags: [shapoval]
source:
  plugin: shapoval_media_files
destination:
  plugin: 'entity:media'
process:
  bundle: bundle
  name: name
  uid:
    plugin: default_value
    default_value: 1
  status:
    plugin: default_value
    default_value: 1
  field_media_image/target_id:
    - plugin: shapoval_file
      source: path
      only: image
    - plugin: skip_on_empty
      method: process
  field_media_document/target_id:
    - plugin: shapoval_file
      source: path
      only: document
    - plugin: skip_on_empty
      method: process
  field_media_document/display:
    plugin: default_value
    default_value: 1
