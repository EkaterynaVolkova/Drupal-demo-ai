id: site_blocks
label: 'Block: contacts / footer text'
migration_tags: [shapoval]
source:
  plugin: shapoval_table
  key: migrate
  table: settings
  id: ID
  where:
    LangID: 1
destination:
  plugin: 'entity:block_content'
  default_bundle: basic
process:
  # Fixed UUID: block.block.project_base_contacts refers to it, so the block placement survives a re-run.
  uuid:
    plugin: default_value
    default_value: 82259b8d-206e-47ec-bf95-76114fd3a9a6
  type:
    plugin: default_value
    default_value: basic
  info:
    plugin: default_value
    default_value: 'Контакты'
  body/value:
    - plugin: concat
      source:
        - text
        - disclamer
    - plugin: shapoval_body
    # The address and the street go on one row in the header.
    - plugin: str_replace
      search: '<br>str. Petru'
      replace: ', str. Petru'
  body/format:
    plugin: default_value
    default_value: full_html
