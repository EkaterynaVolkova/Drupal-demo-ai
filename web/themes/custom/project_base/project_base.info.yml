name: 'Project Base'
type: theme
'base theme': false
version: 1.0.0
libraries:
  - project_base/base
  - project_base/messages
  - project_base/site
  - core/normalize
libraries-extend:
  user/drupal.user:
    - project_base/user
  core/drupal.dropbutton:
    - project_base/dropbutton
  core/drupal.dialog:
    - project_base/dialog
  file/drupal.file:
    - project_base/file
  core/drupal.item-list:
    - project_base/item-list
  core/drupal.progress:
    - project_base/progress
  core/drupal.tablesort:
    - project_base/drupal.tablesort
description: 'Standalone base theme generated from core Starterkit.'
core_version_requirement: ^11
generator: 'starterkit_theme:11.4.9'
regions:
  header: 'Header (logo)'
  header_right: 'Header right (contacts)'
  sidebar_first: 'Left column'
  highlighted: Highlighted
  help: Help
  content: Content
  content_top: 'Content top (title, messages, promo)'
  footer: Footer
  page_top: 'Page top'
  page_bottom: 'Page bottom'
ckeditor5-stylesheets:
  - css/editor.css
